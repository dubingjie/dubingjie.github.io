    <h1 class="post-title">Linux 常用命令：文件、工具与系统管理</h1>
    <div class="post-meta"><time datetime="2026-08-23T14:00:00.000Z">2026-08-23</time><span aria-hidden="true"> / </span><a href="/tags/Linux/">Linux</a></div>
    <p class="article-description">整理工具安装、文件操作、命令帮助与系统管理中常用的 Linux 命令。</p>
  </header>
  <div class="post-content"><p>查看是否安装：–version</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">git --veresion</span><br><span class="line">gh --version</span><br></pre></td></tr></table></figure>

<p>查看安装路径：</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line"><span class="built_in">which</span> git</span><br></pre></td></tr></table></figure>

<p>安装gh：</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br></pre></td><td class="code"><pre><span class="line"><span class="built_in">sudo</span> apt install gh</span><br><span class="line"></span><br><span class="line"><span class="comment"># 登录</span></span><br><span class="line">gh auth login</span><br><span class="line"></span><br><span class="line"><span class="comment"># 查看状态（是否登录成功）</span></span><br><span class="line">gh auth status</span><br><span class="line"></span><br><span class="line"><span class="comment"># 创建公开仓库</span></span><br><span class="line">gh repo create my-project --public</span><br><span class="line"></span><br><span class="line"><span class="comment">#上传代码</span></span><br><span class="line">git init</span><br><span class="line">git add</span><br><span class="line">git commit</span><br></pre></td></tr></table></figure>

<p>查看安装路径：</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># 查看安装路径用 which</span></span><br><span class="line"><span class="built_in">which</span> git</span><br><span class="line"><span class="built_in">which</span> gh</span><br></pre></td></tr></table></figure>

<p>常用的文件操作命令：</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br><span class="line">72</span><br><span class="line">73</span><br><span class="line">74</span><br><span class="line">75</span><br><span class="line">76</span><br><span class="line">77</span><br><span class="line">78</span><br><span class="line">79</span><br><span class="line">80</span><br><span class="line">81</span><br><span class="line">82</span><br><span class="line">83</span><br><span class="line">84</span><br><span class="line">85</span><br><span class="line">86</span><br><span class="line">87</span><br><span class="line">88</span><br><span class="line">89</span><br><span class="line">90</span><br><span class="line">91</span><br><span class="line">92</span><br><span class="line">93</span><br><span class="line">94</span><br><span class="line">95</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># 显示当前所在目录</span></span><br><span class="line"><span class="built_in">pwd</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 显示当前用户名</span></span><br><span class="line"><span class="built_in">whoami</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 列出当前目录内容</span></span><br><span class="line"><span class="built_in">ls</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 详细格式列出内容（行首 d 是文件夹，- 是文件）</span></span><br><span class="line"><span class="built_in">ls</span> -l</span><br><span class="line"></span><br><span class="line"><span class="comment"># 显示所有文件，包括隐藏文件（. 开头的）</span></span><br><span class="line"><span class="built_in">ls</span> -a</span><br><span class="line"></span><br><span class="line"><span class="comment"># 创建名为 practice 的文件夹</span></span><br><span class="line"><span class="built_in">mkdir</span> practice</span><br><span class="line"></span><br><span class="line"><span class="comment"># 进入 practice 文件夹</span></span><br><span class="line"><span class="built_in">cd</span> practice</span><br><span class="line"></span><br><span class="line"><span class="comment"># 回到家目录</span></span><br><span class="line"><span class="built_in">cd</span> ~</span><br><span class="line"></span><br><span class="line"><span class="comment"># 回到上一级目录</span></span><br><span class="line"><span class="built_in">cd</span> ..</span><br><span class="line"></span><br><span class="line"><span class="comment"># 创建一个空文件</span></span><br><span class="line"><span class="built_in">touch</span> hello.txt</span><br><span class="line"></span><br><span class="line"><span class="comment"># 一次创建多个空文件</span></span><br><span class="line"><span class="built_in">touch</span> a.txt b.txt</span><br><span class="line"></span><br><span class="line"><span class="comment"># 写入内容到文件（覆盖原有内容）</span></span><br><span class="line"><span class="built_in">echo</span> <span class="string">&quot;hello linux&quot;</span> &gt; hello.txt</span><br><span class="line"></span><br><span class="line"><span class="comment"># 追加一行内容到文件末尾</span></span><br><span class="line"><span class="built_in">echo</span> <span class="string">&quot;second line&quot;</span> &gt;&gt; hello.txt</span><br><span class="line"></span><br><span class="line"><span class="comment"># 查看文件内容</span></span><br><span class="line"><span class="built_in">cat</span> hello.txt</span><br><span class="line"></span><br><span class="line"><span class="comment"># 复制文件</span></span><br><span class="line"><span class="built_in">cp</span> hello.txt backup.txt</span><br><span class="line"></span><br><span class="line"><span class="comment"># 复制文件夹及其所有内容（必须加 -r）</span></span><br><span class="line"><span class="built_in">cp</span> -r notes notes_backup</span><br><span class="line"></span><br><span class="line"><span class="comment"># 把文件移动进文件夹</span></span><br><span class="line"><span class="built_in">mv</span> day1.txt notes/</span><br><span class="line"></span><br><span class="line"><span class="comment"># 一次移动多个文件进文件夹（最后一个是目标文件夹）</span></span><br><span class="line"><span class="built_in">mv</span> day1.txt day2.txt notes/</span><br><span class="line"></span><br><span class="line"><span class="comment"># 文件改名（移动和改名是同一个命令）</span></span><br><span class="line"><span class="built_in">mv</span> wed.txt wed_backup.txt</span><br><span class="line"></span><br><span class="line"><span class="comment"># 删除文件（没有回收站，删前先 ls 确认）</span></span><br><span class="line"><span class="built_in">rm</span> backup.txt</span><br><span class="line"></span><br><span class="line"><span class="comment"># 删除空文件夹（最安全的删法）</span></span><br><span class="line"><span class="built_in">rmdir</span> week2_extra</span><br><span class="line"></span><br><span class="line"><span class="comment"># 删除文件夹及里面所有内容（危险，想清楚再敲）</span></span><br><span class="line"><span class="built_in">rm</span> -r notes_backup</span><br><span class="line"></span><br><span class="line"><span class="comment"># 不进入文件夹，直接查看里面的内容</span></span><br><span class="line"><span class="built_in">ls</span> notes/</span><br><span class="line"></span><br><span class="line"><span class="comment"># 用 .. 往上走两层再查看 week2（相对路径）</span></span><br><span class="line"><span class="built_in">ls</span> ../../week2</span><br><span class="line"></span><br><span class="line"><span class="comment"># 用绝对路径查看（在任何位置都有效）</span></span><br><span class="line"><span class="built_in">ls</span> /home/dubingjie/practice/study_plan/week2</span><br><span class="line"></span><br><span class="line"><span class="comment"># 用 ~ 代表家目录写路径</span></span><br><span class="line"><span class="built_in">ls</span> ~/practice/study_plan/week2</span><br><span class="line"></span><br><span class="line"><span class="comment"># 查看敲过的所有命令历史</span></span><br><span class="line"><span class="built_in">history</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 清屏（快捷键 Ctrl + L 效果相同）</span></span><br><span class="line">clear</span><br><span class="line"></span><br><span class="line"><span class="comment"># 查看某命令是内部命令还是外部程序</span></span><br><span class="line"><span class="built_in">type</span> <span class="built_in">cd</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 查看内部命令的帮助</span></span><br><span class="line"><span class="built_in">help</span> <span class="built_in">cd</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 查看外部命令的简要帮助</span></span><br><span class="line"><span class="built_in">ls</span> --<span class="built_in">help</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 查看外部命令的完整手册（按 q 退出）</span></span><br><span class="line">man <span class="built_in">ls</span></span><br></pre></td></tr></table></figure>

<p>其他一些命令：</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># 重启虚拟机</span></span><br><span class="line">reboot</span><br><span class="line"><span class="comment"># 查看虚拟机的网络配置文件内容</span></span><br><span class="line"><span class="built_in">cat</span> /etc/netplan/50-cloud-init.yaml</span><br></pre></td></tr></table></figure>
